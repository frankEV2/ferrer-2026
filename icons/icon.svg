<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="70%" r="80%">
      <stop offset="0" stop-color="#3A2418"/>
      <stop offset=".55" stop-color="#17110D"/>
      <stop offset="1" stop-color="#0B0907"/>
    </radialGradient>
    <radialGradient id="fire" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FFD98A" stop-opacity=".95"/>
      <stop offset=".35" stop-color="#F08A2E" stop-opacity=".6"/>
      <stop offset="1" stop-color="#C4571B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F2EBE0"/>
      <stop offset=".45" stop-color="#BDB3A6"/>
      <stop offset="1" stop-color="#6E655B"/>
    </linearGradient>
    <linearGradient id="steelD" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9A9083"/>
      <stop offset="1" stop-color="#3F3933"/>
    </linearGradient>
    <linearGradient id="hot" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C4571B"/>
      <stop offset=".5" stop-color="#FFE7A6"/>
      <stop offset="1" stop-color="#E8792A"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7A4A2A"/>
      <stop offset="1" stop-color="#4A2A18"/>
    </linearGradient>
  </defs>
  <!-- fons de farga -->
  <rect width="512" height="512" rx="0" fill="url(#bg)"/>
  <circle cx="256" cy="300" r="190" fill="url(#fire)" opacity=".55"/>
  <!-- anell de ferro forjat amb reblons -->
  <circle cx="256" cy="256" r="214" fill="none" stroke="#C9693F" stroke-width="6" opacity=".55"/>
  <g fill="#C9693F" opacity=".8">
    <circle cx="256" cy="42" r="7"/><circle cx="256" cy="470" r="7"/><circle cx="42" cy="256" r="7"/><circle cx="470" cy="256" r="7"/>
  </g>
  <!-- martell -->
  <g transform="rotate(-38 300 170)">
    <rect x="292" y="118" width="22" height="168" rx="10" fill="url(#wood)"/>
    <rect x="246" y="82" width="116" height="52" rx="10" fill="url(#steel)"/>
    <rect x="246" y="82" width="116" height="12" rx="6" fill="#FFFFFF" opacity=".35"/>
    <rect x="352" y="88" width="16" height="40" rx="5" fill="url(#steelD)"/>
  </g>
  <!-- espurnes -->
  <g fill="#FFD98A">
    <circle cx="228" cy="232" r="7"/><circle cx="196" cy="214" r="5"/><circle cx="274" cy="214" r="5"/>
    <circle cx="170" cy="238" r="4"/><circle cx="302" cy="238" r="4"/><circle cx="246" cy="196" r="4"/>
  </g>
  <g stroke="#FFB04A" stroke-width="5" stroke-linecap="round">
    <path d="M216 250l-30-26M244 246l-4-36M270 250l30-26"/>
  </g>
  <!-- peça roent sobre l'enclusa -->
  <rect x="170" y="262" width="150" height="16" rx="8" fill="url(#hot)"/>
  <!-- enclusa -->
  <path d="M86 280h304c26 0 44 8 52 20-16 12-38 18-62 18h-28c-22 0-38 14-42 34l-4 20h-104l-6-22c-4-18-18-32-38-32H120c-22 0-36-14-34-38z" fill="url(#steel)"/>
  <path d="M86 280h304c26 0 44 8 52 20H92c-4-6-6-12-6-20z" fill="#FFFFFF" opacity=".28"/>
  <path d="M206 372h104l26 44H180z" fill="url(#steelD)"/>
  <rect x="160" y="414" width="196" height="22" rx="6" fill="#2E2925"/>
