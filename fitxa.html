<!DOCTYPE html>
<html lang="ca"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#2A2825"><meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex, nofollow">
<title>Fitxa d'escultura</title>
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400&family=Schibsted+Grotesk:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Redisseny «Sala del taller»: mateixa estètica que el catàleg */
:root{--paper:#F2EFEA;--paper-2:#E8E3DB;--card:#FBFAF7;--ink:#1A1815;--ink-2:#6A635A;--rule:#DED7CC;--iron:#1F1D1A;--ember:#B04E1C;
 --serif:'Fraunces',Georgia,serif;--sans:'Schibsted Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;--mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;--ease:cubic-bezier(.23,1,.32,1)}
@media(prefers-color-scheme:dark){:root{--paper:#121110;--paper-2:#0C0B0A;--card:#1A1917;--ink:#EDE7DC;--ink-2:#A39B8E;--rule:#2D2A26;--iron:#E3884A;--ember:#E8935A}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;
 padding:calc(20px + env(safe-area-inset-top)) 20px calc(32px + env(safe-area-inset-bottom))}
main{max-width:1120px;margin:0 auto;animation:in .4s var(--ease) both}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hero{border-radius:4px;overflow:hidden;background:var(--paper-2);min-height:120px;display:flex;align-items:center;justify-content:center}
.hero img{width:100%;display:block;max-height:78vh;object-fit:contain}
.none{color:var(--ink-2);font-family:var(--mono);font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;padding:60px 0}
.strip{display:flex;gap:8px;overflow-x:auto;margin:10px 0 0;padding:2px 1px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.strip button{flex:0 0 auto;width:60px;height:60px;border-radius:4px;overflow:hidden;border:1.5px solid transparent;padding:0;background:var(--paper-2);opacity:.7;cursor:pointer;transition:opacity .2s,border-color .2s}
.strip button.on{border-color:var(--ink);opacity:1}
.strip img{width:100%;height:100%;object-fit:cover;display:block}
.num{margin:26px 0 8px;font-family:var(--mono);font-weight:500;font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;color:var(--ember)}
h1{font-family:var(--serif);font-weight:400;letter-spacing:-.025em;font-size:clamp(2.2rem,7vw,3.2rem);line-height:1.02;margin:0 0 22px}
h1::first-letter{text-transform:uppercase}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:12px 0;border-top:1px solid var(--rule);font-size:.92rem}
.k{color:var(--ink-2);font-size:.82rem;flex:0 0 42%}.v{text-align:right;flex:1}.v.e{color:var(--ink-2)}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px;border-top:1px solid var(--rule);padding-top:18px}
.acts a,.acts button{flex:1 1 auto;text-align:center;text-decoration:none;padding:12px 16px;border-radius:8px;border:1px solid var(--rule);background:var(--card);color:var(--ink);font-size:.88rem;font-weight:500;cursor:pointer;font-family:inherit;transition:transform .16s var(--ease)}
.acts a:active,.acts button:active{transform:scale(.97)}
.acts .main{background:var(--iron);color:var(--paper);border-color:var(--iron)}
.media{margin-top:16px}
.media audio{width:100%}
.media .vid{position:relative;aspect-ratio:16/9;border-radius:4px;overflow:hidden;background:#000}
.media iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.desc{margin:34px 0 0;font-family:var(--serif);font-size:1.08rem;line-height:1.7;white-space:pre-wrap}
.desc h2{font-family:var(--mono);font-weight:500;font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;margin:0 0 10px;color:var(--ink)}
.notes{margin-top:16px;background:var(--card);border:1px solid var(--rule);border-radius:8px;padding:12px 14px;font-size:.92rem;line-height:1.5;white-space:pre-wrap}
.notes span{display:block;font-family:var(--mono);font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);margin-bottom:4px}
.msg{text-align:center;color:var(--ink-2);font-family:var(--serif);font-size:1.2rem;padding:80px 10px}
.back{display:inline-block;margin:0 0 14px;padding:9px 16px;border-radius:8px;border:1px solid var(--rule);background:var(--card);color:var(--ink);font-family:inherit;font-size:.84rem;font-weight:500;cursor:pointer}
.foot{text-align:center;color:var(--ink-2);font-family:var(--mono);font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;margin-top:40px}
@media(min-width:900px){
 main{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(320px,1fr);column-gap:56px;align-items:start}
 main>*{grid-column:2;min-width:0}
 main>.back{grid-column:1/-1;justify-self:start}
 main>.hero{grid-column:1;grid-row:1/span 40;position:sticky;top:24px;min-height:70vh}
 main:has(>.back)>.hero{grid-row:2/span 40}
 main>.strip{margin:0 0 10px}
 main>.num{margin-top:0}
 main>.foot,main>.msg{grid-column:1/-1}
}
@media(prefers-reduced-motion:reduce){main{animation:none}}
</style></head><body>
<main id="m"><p class="msg">Carregant…</p></main>
<script>
(function(){
var KEY="AIzaSyCgZiUqvhmhfawhqm1HfduLi1udbUn6vVI",PROJ="escultures-inventari";
var BASE='https://firestore.googleapis.com/v1/projects/'+PROJ+'/databases/(default)/documents/';
var F=[['autor','Autor/a'],['serie','Sèrie / col·lecció'],['tipus','Tipus'],['any','Any'],['tecnica','Tècnica / materials'],['dim','Dimensions (alt/ample/fons)'],['lloc','Lloc per veure-la']];
var m=document.getElementById('m');
var fromApp=/[?&]from=app/.test(location.search);
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function safe(u){u=String(u||'').trim();return /^https?:\/\//i.test(u)?u:''}
function val(f){if(!f)return'';if(f.stringValue!==undefined)return f.stringValue;if(f.booleanValue!==undefined)return f.booleanValue;if(f.arrayValue)return(f.arrayValue.values||[]).map(val);return''}
var n=parseInt((location.search.match(/[?&]p=(\d+)/)||[])[1],10);
if(!n){m.innerHTML='<p class="msg">Enllaç no vàlid.</p>';return}
function get(path){return fetch(BASE+path+'?key='+KEY).then(function(r){if(!r.ok)throw r.status;return r.json()})}
function media(url){
  var u=safe(url);if(!u)return'';
  var vm=/vimeo\.com\/(?:video\/)?(\d+)/i.exec(u),yt=/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([\w-]{11})/i.exec(u);
  if(/\.(mp3|m4a|ogg|wav|aac)(\?|#|$)/i.test(u))return'<div class="media"><audio controls preload="none" src="'+esc(u)+'"></audio></div>';
  if(vm)return'<div class="media"><div class="vid"><iframe src="https://player.vimeo.com/video/'+vm[1]+'?dnt=1" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen title="Vídeo"></iframe></div></div>';
  if(yt)return'<div class="media"><div class="vid"><iframe src="https://www.youtube-nocookie.com/embed/'+yt[1]+'" allow="fullscreen" allowfullscreen title="Vídeo"></iframe></div></div>';
  return'<div class="media"><a href="'+esc(u)+'" target="_blank" rel="noopener" style="color:var(--ember)">▶ Escolta o mira el recurs ↗</a></div>';
}
get('inventari/p'+n).then(function(d){
 var f=d.fields||{},p={};for(var k in f)p[k]=val(f[k]);
 if(p.deleted===true)throw 404;
 var t=String(p.titol||'').trim(),extra=Array.isArray(p.extra)?p.extra.filter(function(x){return typeof x==='string'}):[];
 var title=t||('Peça '+n),url=location.origin+location.pathname+'?p='+n;
 var h=(fromApp?'<button class="back" onclick="history.length>1?history.back():location.href=\'./\'">← Tornar</button>':'')+
 '<div class="hero" id="hero">'+(p.photo?'<img alt="" src="'+esc(p.photo)+'">':'<span class="none">Sense fotografia</span>')+'</div><div class="strip" id="strip"></div>'+
 '<div class="num">Núm. '+n+'</div><h1>'+(t?esc(t):'Sense títol')+'</h1>';
 F.forEach(function(x){var v=String(p[x[0]]||'').trim();if(v)h+='<div class="row"><span class="k">'+x[1]+'</span><span class="v">'+esc(v)+'</span></div>'});
 var acts='<button class="main" id="share">↗ Comparteix</button>';
 if(String(p.lloc||'').trim())acts='<a class="main" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(p.lloc)+'">📍 Com arribar-hi</a>'+acts;
 h+='<div class="acts">'+acts+'</div>'+media(p.audio);
 if(String(p.desc||'').trim())h+='<div class="desc"><h2>La seva història</h2>'+esc(p.desc)+'</div>';
 if(String(p.obs||'').trim())h+='<div class="notes"><span>Observacions</span>'+esc(p.obs)+'</div>';
 h+='<p class="foot">Les peces del ferrer · Antoni Mas Castelltort</p>';
 m.innerHTML=h;document.title=title;
 var sh=document.getElementById('share');
 sh.onclick=function(){
  if(navigator.share)navigator.share({title:title,text:title+' · Antoni Mas Castelltort',url:url}).catch(function(){});
  else if(navigator.clipboard)navigator.clipboard.writeText(url).then(function(){sh.textContent='Enllaç copiat ✓'});
 };
 // fotos de detall
 var imgs=[p.photo].filter(Boolean);
 function strip(){
  var el=document.getElementById('strip');if(imgs.length<2){el.innerHTML='';return}
  el.innerHTML=imgs.map(function(s,i){return'<button class="'+(i===0?'on':'')+'" data-i="'+i+'"><img alt="" src="'+esc(s)+'"></button>'}).join('');
  [].forEach.call(el.querySelectorAll('button'),function(b){b.onclick=function(){
   document.getElementById('hero').innerHTML='<img alt="" src="'+esc(imgs[+b.dataset.i])+'">';
   [].forEach.call(el.querySelectorAll('button'),function(x){x.classList.toggle('on',x===b)});
  }});
 }
 extra.forEach(function(id){get('fotos/'+encodeURIComponent(id)).then(function(r){var s=val((r.fields||{}).data);if(s){imgs.push(s);strip()}}).catch(function(){})});
}).catch(function(){m.innerHTML='<p class="msg">No s\'ha trobat aquesta peça.</p>'});
})();
</script></body></html>
